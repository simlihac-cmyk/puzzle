<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puzzle Hub</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="/assets/css/styles.css?v=20260224-10" />
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div class="title">Daily Puzzle Hub</div>
        <div class="sub">Sudoku + Picross Daily MVP</div>
      </div>

      <div class="panel">
        <div class="row">
          <input id="userId" placeholder="user id" value="guest" />
          <button id="loadSudoku">Today Sudoku</button>
          <button id="loadPicross">Today Picross</button>
          <button class="secondary" id="submitBtn">Submit</button>
          <button class="secondary" id="retryBtn">Reload</button>
        </div>
        <div id="timer">00:00</div>
        <div id="status">Choose a mode and load a puzzle.</div>
      </div>

      <div class="game-area">
        <div id="board"></div>
        <div class="panel leaderboard">
          <strong>Leaderboard</strong>
          <div id="leaderboard">No data yet.</div>
        </div>
      </div>
    </div>

    <script type="module" src="/assets/js/app.js?v=20260224-10"></script>
  </body>
</html>
