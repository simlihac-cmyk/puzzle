<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puzzle Hub</title>
    <link rel="stylesheet" href="/assets/css/styles.css" />
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div class="title">Daily Puzzle Hub</div>
        <div class="sub">스도쿠 + 피크로스 데일리 MVP</div>
      </div>

      <div class="panel">
        <div class="row">
          <input id="userId" placeholder="user id" value="guest" />
          <button id="loadSudoku">오늘 스도쿠</button>
          <button id="loadPicross">오늘 피크로스</button>
          <button class="secondary" id="submitBtn">제출</button>
        </div>
        <div id="status">모드를 선택해 퍼즐을 불러오세요.</div>
      </div>

      <div class="game-area">
        <div id="board"></div>
        <div class="panel leaderboard">
          <strong>리더보드</strong>
          <div id="leaderboard">아직 데이터가 없습니다.</div>
        </div>
      </div>
    </div>

    <script type="module" src="/assets/js/app.js"></script>
  </body>
</html>
