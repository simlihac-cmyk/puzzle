<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f7a5f" />
    <title>Puzzle Hub</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="/assets/css/styles.css?v=20260225-07" />
  </head>
  <body>
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>

    <div class="wrap">
      <header class="top">
        <h1 class="title">Daily Puzzle Hub</h1>
        <p class="sub">Sudoku + Picross | Mobile-first Daily Challenge</p>
      </header>

      <section class="panel controls">
        <div class="row primary-controls">
          <label class="sr-only" for="userId">User ID</label>
          <input id="userId" placeholder="user id" value="guest" maxlength="24" pattern="[A-Za-z0-9._-]{1,24}" autocomplete="nickname" spellcheck="false" />
          <label class="sr-only" for="difficulty">Difficulty</label>
          <select id="difficulty" aria-label="difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
          <button id="loadSudoku">Today Sudoku</button>
          <button id="loadPicross">Today Picross</button>
        </div>

        <div class="row utility-controls">
          <button class="secondary" id="submitBtn">Submit</button>
          <button class="secondary" id="retryBtn">Reload</button>
          <button class="secondary" id="checkBtn">Check</button>
          <button class="secondary" id="clearBtn">Clear</button>
        </div>

        <div id="timer" aria-label="elapsed timer">00:00</div>
        <div id="status" role="status" aria-live="polite">모드를 선택해 시작하세요.</div>
        <div id="modeInfo" class="mode-info" aria-live="polite"></div>
      </section>

      <main class="game-area">
        <section class="panel board-panel">
          <div id="boardWrap" class="board-wrap">
            <div id="board"></div>
          </div>

          <div id="sudokuPopup" class="sudoku-popup hidden" aria-label="sudoku popup keypad"></div>

          <div id="picrossTools" class="picross-tools hidden">
            <button id="fillModeBtn" class="mode-btn active">Fill</button>
            <button id="markModeBtn" class="mode-btn">Mark(X)</button>
          </div>
        </section>

        <section class="panel leaderboard">
          <strong>Leaderboard</strong>
          <div id="leaderboard">No data yet.</div>
        </section>
      </main>
    </div>

    <script type="module" src="/assets/js/app.js?v=20260225-07"></script>
  </body>
</html>
